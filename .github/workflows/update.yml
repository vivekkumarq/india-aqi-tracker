name: update-aqi
on:
  schedule:
    # 06:00 and 18:00 IST, each followed by two retries in case GitHub skips a scheduled run.
    - cron: "30 0 * * *"
    - cron: "15 1 * * *"
    - cron: "0 2 * * *"
    - cron: "30 12 * * *"
    - cron: "15 13 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: update-aqi
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 test_fetch.py && python3 fetch.py ${{ github.event_name == 'schedule' && '--if-due' || '' }}
      - run: |
          git config user.name "vivekkumarq"
          git config user.email "51886550+vivekkumarq@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "AQI snapshot $(TZ=Asia/Kolkata date '+%d %b %Y, %H:%M') IST"
          git push
