name: update-aqi
on:
  schedule:
    # About 06:00 and 18:00 IST, each followed by two retries in case GitHub skips a run.
    # Odd minutes on purpose: GitHub delays runs queued at busy minutes like :00 and :30 by hours.
    - cron: "23 0 * * *"
    - cron: "8 1 * * *"
    - cron: "53 1 * * *"
    - cron: "23 12 * * *"
    - cron: "8 13 * * *"
    - cron: "53 13 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: update-aqi
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 test_fetch.py && python3 fetch.py ${{ github.event_name == 'schedule' && '--if-due' || '' }}
      - run: |
          git config user.name "vivekkumarq"
          git config user.email "51886550+vivekkumarq@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "AQI snapshot $(TZ=Asia/Kolkata date '+%d %b %Y, %H:%M') IST"
          git push || (git pull --rebase -q && git push)
